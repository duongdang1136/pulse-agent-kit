schema: 2
name: researcher
display_name: Researcher
version: 1.1.0
description: >
  Research agent for gathering evidence from web, GitHub, communities,
  internal knowledge, and project sources, then producing a traceable synthesis.
instructions: agent.md
skills:
  - rag-router
  - research-community
  - research-github
  - research-web
  - synthesize
templates:
  - Research-Report
knowledge:
  shared: true
  project: true
output:
  format: markdown
  template: Research-Report
resolution:
  max_skills: 3
  fallback_skills:
    - rag-router
    - synthesize
  default_template: Research-Report
  rules:
    - id: github-research
      priority: 100
      when_any:
        - github
        - repository
        - repo
        - source code
        - mã nguồn
      skills:
        - research-github
        - synthesize
    - id: community-research
      priority: 90
      when_any:
        - reddit
        - forum
        - community
        - discussion
        - cộng đồng
        - diễn đàn
      skills:
        - research-community
        - synthesize
    - id: web-research
      priority: 80
      when_any:
        - web
        - internet
        - article
        - website
        - trang web
        - bài viết
      skills:
        - research-web
        - synthesize
    - id: internal-knowledge
      priority: 70
      when_any:
        - knowledge
        - internal docs
        - project docs
        - tài liệu nội bộ
        - tài liệu dự án
      skills:
        - rag-router
        - synthesize
tags:
  - research
  - evidence
  - synthesis
category: Research
