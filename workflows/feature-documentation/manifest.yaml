schema: 1
name: feature-documentation
display_name: Feature Documentation
version: 1.0.0
description: >
  Research a product feature, identify evidence and gaps, clarify unresolved
  business decisions, and produce a traceable business analysis document.
instructions: workflow.md
inputs:
  required: [project, feature, user_requirements]
  optional: [target_users, constraints, reference_links]
stages:
  - id: research
    agent: researcher
    skills: [research-plan, rag-query, research-routing, research-web, research-docs, research-github, research-community, research-market-map, research-product-signal, research-funding-signal, evidence-evaluation, synthesize]
    consumes: [project, feature, user_requirements, project_sources, project_knowledge]
    output: Research-Report
    handoff_to: research_intake
  - id: research_intake
    agent: itba
    skills: [research-intake-execution]
    consumes: [project, feature, user_requirements, research.output, user_clarifications, project_sources, project_knowledge]
    output: Research-Intake-Execution
    handoff_to: analysis
  - id: analysis
    agent: itba
    skills: [heuristic-audit, component-audit, layout-audit, screen, bpmn, usecase, acceptance-criteria, business-rules, wireframe-text, wireframe-lofi, wireframe-hifi, stakeholder-review, design-critique, api-doc, db-schema, metrics, cms-tools]
    consumes: [project, feature, user_requirements, research.output, research_intake.output, user_clarifications, project_sources, project_knowledge]
    output: BA-Document
interaction:
  clarification_required_when:
    - required_input_missing
    - requirements_conflict
    - source_conflict
    - business_decision_missing
    - acceptance_criteria_not_derivable
    - data_definition_ambiguous
tags: [research, business-analysis, feature-documentation]
